name: Deploy Hexo to Blog Repo

on:
  push:
    branches:
      - main  # 如果你的源码默认分支是 master，请改成 master

# 关键优化：并发控制，连续推送时只保留最新一次，取消旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0  # 拉取完整历史，避免 Hexo 生成时因浅克隆缺少提交信息

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'  # 缓存 npm 依赖，加速构建

      - name: Install Dependencies
        run: npm ci  # 比 npm install 更快更稳定，需要 package-lock.json 存在
        # 如果没有 package-lock.json，请改回 npm install

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.HEXO_DEPLOY_PRI }}
          known_hosts: 'placeholder'  # 先占位，下一步用 ssh-keyscan 覆盖

      - name: Add GitHub to known_hosts
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build
        run: |
          npx hexo clean
          npx hexo generate
          npx hexo deploy

      # - name: Deploy to Blog Repo
      #   uses: peaceiris/actions-gh-pages@v3
      #   with:
      #     deploy_key: ${{ secrets.HEXO_DEPLOY_PRI }}
